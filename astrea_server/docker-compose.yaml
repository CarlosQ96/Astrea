services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: astrea
      POSTGRES_PASSWORD: "JXtJvkwRKeFc0AInIxTPCU2dkGIVYo7C"
    volumes:
      - astrea_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "DxYaGO0hkDmSbfKS2NZ6gnAOop2JqOhL"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: astrea_test
      POSTGRES_PASSWORD: "VaQf-vYPadczkLCMuzfBGIf0rszSd_WI"
    volumes:
      - astrea_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "2tXXM7SWyfEN3Svs1VWpT5LWW4QtKKpe"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  astrea_data:
  astrea_test_data:
