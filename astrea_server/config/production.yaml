# Railway production configuration
# Database URL is read from SERVERPOD_DATABASE_URL environment variable

apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: https

insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: https

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: https

# Database config - password from SERVERPOD_PASSWORD_database env var
database:
  host: pgvector.railway.internal
  port: 5432
  name: railway
  user: postgres

redis:
  enabled: false
  host: localhost
  port: 6379

maxRequestSize: 524288

sessionLogs:
  consoleEnabled: true
