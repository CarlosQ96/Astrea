class: ChatResponse

fields:
  intent: String
  response: String
  actionParsed: bool, default=false

  # Create reminder action
  actionTitle: String?
  actionDueAtUtc: DateTime?
  actionPriority: int?
  actionDescription: String?

  # Complete/snooze/delete action
  actionReminderId: int?
  actionSnoozeMinutes: int?
