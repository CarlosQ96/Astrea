class: UserSettings
table: user_settings

fields:
  userId: UuidValue
  defaultSnoozeMinutes: int, default=15
  quietHoursStart: String?  # HH:MM format
  quietHoursEnd: String?    # HH:MM format
  voiceEnabled: bool, default=true
  timezone: String, default="UTC"

indexes:
  user_settings_user_idx:
    fields: userId
    unique: true
