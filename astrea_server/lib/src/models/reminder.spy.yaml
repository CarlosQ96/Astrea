class: Reminder
table: reminders

fields:
  userId: UuidValue
  title: String
  description: String?
  dueAtUtc: DateTime
  originalTimezone: String  # IANA format
  repeatRule: String?       # iCalendar RRULE
  snoozedUntilUtc: DateTime?
  isCompleted: bool, default=false
  priority: int, default=2  # 1=low, 2=medium, 3=high
  revision: int, default=1
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now

indexes:
  reminder_user_idx:
    fields: userId
  reminder_user_active_idx:
    fields: userId, isCompleted, dueAtUtc
  reminder_due_idx:
    fields: dueAtUtc
